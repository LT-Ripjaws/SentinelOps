name: sentinelops

services:
  mongo:
    image: mongo:7
    container_name: sentinelops-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: sentinelops_root
      MONGO_INITDB_ROOT_PASSWORD: sentinelops_password
    volumes:
      - sentinelops_mongo_data:/data/db

volumes:
  sentinelops_mongo_data:
